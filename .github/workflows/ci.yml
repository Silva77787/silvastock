name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run so newly published vulnerabilities are caught even without new commits.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NODE_VERSION: "24"

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore SilvaStock.slnx

      - name: Check formatting
        run: dotnet format SilvaStock.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SilvaStock.slnx --configuration Release --no-restore

      # Integration tests start Postgres with Testcontainers (Docker is available on ubuntu runners).
      - name: Test
        run: >
          dotnet test SilvaStock.slnx --configuration Release --no-build
          --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: ignore

  web:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Generated API types are up to date
        run: npm run gen:api:check

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contract:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint docs/api/openapi.yaml
        run: npx --yes @redocly/cli@2 lint docs/api/openapi.yaml --format=github-actions

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- Security

  sast:
    name: SAST (CodeQL ${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: NuGet packages (including transitive)
        run: |
          dotnet restore SilvaStock.slnx
          dotnet list SilvaStock.slnx package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then
            echo "::error::Vulnerable NuGet packages found (see the list above)."
            exit 1
          fi

      - name: npm packages shipped to the browser (high and critical)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0

  # ---------------------------------------------------------------- Gate

  ci-ok:
    name: CI passed
    if: always()
    needs: [dotnet, web, contract, secrets, sast, dependencies, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::At least one CI job did not succeed ($r)."; exit 1 ;;
            esac
          done
