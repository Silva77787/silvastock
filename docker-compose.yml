# Local dependencies for development. Production uses Neon (Postgres) and Cloudflare R2.
# Usage: cp .env.example .env && docker compose up -d
name: silvastock

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (RustFS) standing in for Cloudflare R2.
  # The plain 1.0.5 tag fails to start (missing container user); the glibc variant works.
  s3:
    image: rustfs/rustfs:1.0.5-glibc
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data

  # One-shot job: creates the buckets and makes only the photos bucket publicly readable.
  s3-init:
    image: amazon/aws-cli:2.40.3
    depends_on:
      - s3
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      PHOTOS_BUCKET: ${S3_PHOTOS_BUCKET:-photos}
      DOCUMENTS_BUCKET: ${S3_DOCUMENTS_BUCKET:-documents}
    entrypoint: ["/bin/sh", "/init/s3-init.sh"]
    volumes:
      - ./infra/local/s3-init.sh:/init/s3-init.sh:ro

volumes:
  postgres-data:
  s3-data:
